        let myChart = echarts.init(document.getElementById('mainChart'), 'dark');

        function renderList() {
            const interval = document.getElementById('filterInterval').value;
            const minVol = parseFloat(document.getElementById('filterVol').value) || 0;
            const container = document.getElementById('listContainer');

            const filtered = ALL_DATA.filter(d => 
                (interval === 'all' || d.interval === interval) && d.vol >= minVol
            );

            container.innerHTML = filtered.map(d => `
                <div class="signal-item p-4" onclick="showChart('${d.symbol}', '${d.interval}')">
                    <div class="flex justify-between font-bold">
                        <span>${d.symbol}</span>
                        <span class="${d.type.includes('金叉') ? 'text-green-500' : 'text-red-500'}">${d.type}</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-gray-500 mt-1 uppercase">
                        <span>${d.interval} | 额: ${ (d.vol/10000).toFixed(1) }万</span>
                        <span>${d.price}</span>
                    </div>
                </div>
            `).join('');

            // 更新下拉框
            const symSelect = document.getElementById('filterSymbol');
            symSelect.innerHTML = '<option value="">跳转到...</option>' + 
                filtered.map(d => `<option value="${d.symbol}">${d.symbol}(${d.interval})</option>`).join('');
        }

        function showChart(symbol, interval) {
            const item = ALL_DATA.find(d => d.symbol === symbol && d.interval === interval);
            if (!item) return;

            document.getElementById('curSymbol').innerText = symbol + " (" + interval + ")";
            document.getElementById('curDesc').innerText = item.desc;

            const k = item.klines;
            const option = {
                backgroundColor: '#141517',
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                grid: { left: '50', right: '50', bottom: '15%' },
                xAxis: { type: 'category', data: k.map(x => x.time_str), borderLine: { show: false } },
                yAxis: [
                    { scale: true, splitLine: { lineStyle: { color: '#222' } } },
                    { scale: true, gridIndex: 0, show: false }
                ],
                series: [
                    {
                        type: 'candlestick',
                        data: k.map(x => [x.o, x.c, x.l, x.h]),
                        itemStyle: { color: '#00b06b', color0: '#ff4d5c', borderColor: '#00b06b', borderColor0: '#ff4d5c' }
                    },
                    {
                        name: 'EMA12', type: 'line', data: k.map(x => x.ema12), 
                        smooth: true, lineStyle: { opacity: 0.5, color: '#f39c12' }, symbol: 'none'
                    },
                    {
                        name: 'EMA50', type: 'line', data: k.map(x => x.ema50), 
                        smooth: true, lineStyle: { opacity: 0.5, color: '#9b59b6' }, symbol: 'none'
                    }
                ]
            };
            myChart.setOption(option);
        }

        document.getElementById('filterInterval').onchange = renderList;
        document.getElementById('filterVol').oninput = renderList;
        document.getElementById('filterSymbol').onchange = (e) => {
            const val = e.target.value;
            if(val) {
                const target = ALL_DATA.find(d => d.symbol === val);
                showChart(target.symbol, target.interval);
            }
        };

        renderList();
        if(ALL_DATA.length > 0) showChart(ALL_DATA[0].symbol, ALL_DATA[0].interval);
        window.onresize = () => myChart.resize();
    </script>
