<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>共振雷达-专业版 (离线完整版)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="data.js"></script> <!-- 引入全量数据 -->
    <style>
        body { background-color: #161a1e; color: #EAECEF; font-family: sans-serif; margin: 0; padding: 15px; }
        .header-bar { background-color: #1e2329; padding: 10px 20px; border-radius: 8px; border-bottom: 1px solid #2b3139; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .logo-text { color: #f0b90b; font-size: 20px; font-weight: bold; }
        
        /* 下拉框样式 */
        select { background-color: #2b3139; color: white; border: 1px solid #474d57; padding: 8px 12px; border-radius: 4px; font-size: 14px; outline: none; cursor: pointer; margin-left: 10px;}
        .top-controls { display: flex; align-items: center; }

        .control-panel { display: flex; flex-wrap: wrap; gap: 10px; background-color: #1e2329; padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; justify-content: space-between;}
        .control-item { display: flex; flex-direction: column; width: calc(12% - 10px); min-width: 100px; }
        .control-item label { color: #848e9c; font-size: 12px; margin-bottom: 5px; }
        .control-item input[type="range"] { accent-color: #f0b90b; width: 100%; cursor: pointer;}
        
        #main-chart { width: 100%; height: 78vh; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo-text">⚡ 共振 Pro 工作站 - 静态离线版</div>
        <div class="top-controls">
            <span style="color:#848e9c; font-size: 14px;">标的:</span>
            <select id="symbol-select"></select>
            <span style="color:#848e9c; font-size: 14px; margin-left: 20px;">周期:</span>
            <select id="interval-select"></select>
        </div>
    </div>

    <!-- 参数控制台 -->
    <div class="control-panel">
        <div class="control-item"><label>收口门槛(%) <span id="val-bw">5.0</span></label><input type="range" id="in_bw" min="1.0" max="15.0" step="0.5" value="5.0"></div>
        <div class="control-item"><label>放量倍数 <span id="val-vol">1.5</span></label><input type="range" id="in_vol" min="1.0" max="5.0" step="0.1" value="1.5"></div>
        <div class="control-item"><label>趋势要求(‱) <span id="val-slope">2</span></label><input type="range" id="in_slope" min="0" max="30" step="1" value="2"></div>
        <div class="control-item"><label>启用平坦过滤 <span id="val-flat-en">开启</span></label><input type="checkbox" id="flat_enabled" checked style="margin-top: 5px; transform: scale(1.2); transform-origin: left;"></div>
        <div class="control-item"><label>平坦窗口(根) <span id="val-flat-win">3</span></label><input type="range" id="flat_window" min="1" max="10" step="1" value="3"></div>
        <div class="control-item"><label>平坦阈值(%) <span id="val-flat-thr">0.1</span></label><input type="range" id="flat_threshold" min="0.1" max="2.0" step="0.1" value="0.1"></div>
        <div class="control-item"><label>止盈(%) <span id="val-tp">2.0</span></label><input type="range" id="tp_pct" min="0.5" max="10.0" step="0.5" value="2.0"></div>
        <div class="control-item"><label>止损(%) <span id="val-sl">1.0</span></label><input type="range" id="sl_pct" min="0.5" max="10.0" step="0.5" value="1.0"></div>
    </div>

    <div id="main-chart"></div>

    <script>
        const myChart = echarts.init(document.getElementById('main-chart'), 'dark');
        const symbolSelect = document.getElementById('symbol-select');
        const intervalSelect = document.getElementById('interval-select');

        // 1. 初始化下拉菜单选项
        const symbols = Object.keys(allData); // 从 data.js 里获取 APPLE, NVIDIA
        symbols.forEach(sym => {
            const opt = document.createElement('option');
            opt.value = sym; opt.innerText = sym;
            symbolSelect.appendChild(opt);
        });

        // 根据选择的品种，更新周期的下拉框
        function updateIntervals(sym) {
            intervalSelect.innerHTML = '';
            const intervals = Object.keys(allData[sym]); // 获取 15m, 1h 等
            intervals.forEach(itv => {
                const opt = document.createElement('option');
                opt.value = itv; opt.innerText = itv;
                intervalSelect.appendChild(opt);
            });
        }

        // 下拉框改变事件
        symbolSelect.addEventListener('change', (e) => {
            updateIntervals(e.target.value);
            calculateAndRender();
        });
        intervalSelect.addEventListener('change', calculateAndRender);

        // 设置默认选中的品种
        if(symbols.length > 0) {
            symbolSelect.value = symbols[0];
            updateIntervals(symbols[0]);
        }

        // 2. 核心计算与渲染
        function calculateAndRender() {
            const curSym = symbolSelect.value;
            const curItv = intervalSelect.value;
            const rawData = allData[curSym][curItv]; // 提取当前图表所需的数据！

            if (!rawData) return;

            const in_bw = parseFloat(document.getElementById('in_bw').value) / 100;
            const in_vol = parseFloat(document.getElementById('in_vol').value);
            const in_slope = parseFloat(document.getElementById('in_slope').value);
            const flat_enabled = document.getElementById('flat_enabled').checked;
            const flat_window = parseInt(document.getElementById('flat_window').value); // 动态获取平坦窗口
            const flat_threshold = parseFloat(document.getElementById('flat_threshold').value);
            const tpPct = parseFloat(document.getElementById('tp_pct').value) / 100;
            const slPct = parseFloat(document.getElementById('sl_pct').value) / 100;

            let marks =[];

            for (let i = 1; i < rawData.length; i++) {
                const curr = rawData[i];
                const prev = rawData[i - 1];

                // --- 动态计算上下轨斜率 (平坦过滤) ---
                if (i >= flat_window) {
                    const past = rawData[i - flat_window];
                    curr.upper_slope = ((curr.boll_up - past.boll_up) / past.boll_up) * 100;
                    curr.lower_slope = ((curr.boll_dn - past.boll_dn) / past.boll_dn) * 100;
                } else {
                    curr.upper_slope = 0; curr.lower_slope = 0;
                }
                const past_upper_slope = (i > 1) ? rawData[i-1].upper_slope : 0;
                const past_lower_slope = (i > 1) ? rawData[i-1].lower_slope : 0;

                // --- 信号计算 ---
                const isGold = (curr.ema12 > curr.ema50) && (prev.ema12 <= prev.ema50);
                const isDead = (curr.ema12 < curr.ema50) && (prev.ema12 >= prev.ema50);
                const sq = prev.bw <= in_bw;
                const vol_ok = curr.max_vr_past >= in_vol;
                const slope_ok_b = curr.ema50_slope >= in_slope;
                const slope_ok_s = curr.ema50_slope <= -in_slope;
                
                let flat_ok = true;
                if (flat_enabled) {
                    flat_ok = (Math.abs(past_upper_slope) <= flat_threshold) && (Math.abs(past_lower_slope) <= flat_threshold);
                }

                let signal = null;
                if (isGold && sq && vol_ok && slope_ok_b && flat_ok) signal = 'BUY';
                if (isDead && sq && vol_ok && slope_ok_s && flat_ok) signal = 'SELL';

                // --- 回测及标记渲染 ---
                if (signal) {
                    const isBuy = signal === 'BUY';
                    const tp = isBuy ? curr.c * (1 + tpPct) : curr.c * (1 - tpPct);
                    const sl = isBuy ? curr.c * (1 - slPct) : curr.c * (1 + slPct);
                    
                    const infoStr = `量比:${curr.max_vr_past.toFixed(1)}x | BW:${(curr.bw*100).toFixed(1)}% | 斜率:${curr.ema50_slope.toFixed(1)}‱` + 
                                    (flat_enabled ? `<br/>平坦:${Math.abs(past_upper_slope).toFixed(2)}% / ${Math.abs(past_lower_slope).toFixed(2)}%` : '');

                    marks.push({
                        coord:[curr.time_str, isBuy ? curr.l : curr.h],
                        symbol: 'rect', symbolSize:[36, 18], symbolOffset: [0, isBuy ? 15 : -15],
                        itemStyle: { color: isBuy ? '#00ffcc' : '#ff33cc' },
                        label: { show: true, formatter: signal, color: '#000', fontWeight: 'bold', fontSize: 10 },
                        info: infoStr
                    });

                    for (let j = i + 1; j < rawData.length; j++) {
                        const fCandle = rawData[j];
                        let hitTP = false, hitSL = false;
                        if (isBuy) { if (fCandle.l <= sl) hitSL = true; if (fCandle.h >= tp) hitTP = true; } 
                        else { if (fCandle.h >= sl) hitSL = true; if (fCandle.l <= tp) hitTP = true; }

                        if (hitSL || hitTP) {
                            const isSlHit = hitSL; 
                            const exitPrice = isSlHit ? sl : tp;
                            marks.push({
                                coord:[fCandle.time_str, exitPrice], symbol: 'pin', symbolSize: 35,
                                itemStyle: { color: isSlHit ? '#f84960' : '#02c076' },
                                label: { show: true, formatter: isSlHit ? 'SL' : 'TP', color: '#fff', fontSize: 10, fontWeight: 'bold' },
                                info: `开仓: ${curr.c.toFixed(2)}<br/>触发: ${exitPrice.toFixed(2)}<br/>盈亏: ${isSlHit?'-':'+'}${(isSlHit?slPct:tpPct)*100}%`
                            });
                            break;
                        }
                    }
                }
            }

            // 3. 渲染 ECharts 图表
            const dates = rawData.map(i => i.time_str);
            const option = {
                backgroundColor: '#161a1e', animation: false,
                tooltip: {
                    trigger: 'axis', axisPointer: { type: 'cross' },
                    backgroundColor: 'rgba(30, 35, 41, 0.95)', borderColor: '#474d57', textStyle: { color: '#eee', fontSize: 12 },
                    formatter: function (params) {
                        let res = '<b>' + params[0].name + '</b><br/>';
                        params.forEach(item => {
                            if (item.componentType === 'markPoint') return;
                            if (item.seriesName === 'K线') {
                                res += `开:${item.value[1].toFixed(2)} 收:${item.value[2].toFixed(2)} 低:${item.value[3].toFixed(2)} 高:${item.value[4].toFixed(2)}<br/>`;
                            } else {
                                let v = Array.isArray(item.value) ? item.value[1] : item.value;
                                res += `${item.marker}${item.seriesName}: <b style="float:right;margin-left:20px">${v.toFixed(2)}</b><br/>`;
                            }
                        });
                        return res;
                    }
                },
                legend: { top: '0%', textStyle: { color: '#848e9c' } },
                grid:[{ left: 50, right: 70, top: '6%', height: '65%' }, { left: 50, right: 70, top: '75%', height: '18%' }],
                xAxis:[
                    { type:'category', data: dates, axisLine: { lineStyle: { color: '#2b3139' } }, axisLabel: { show: false } },
                    { type:'category', gridIndex: 1, data: dates, axisLine: { lineStyle: { color: '#2b3139' } }, axisLabel: { fontSize: 10, color: '#848e9c' } }
                ],
                yAxis:[
                    { scale: true, position: 'right', splitLine: { lineStyle: { color: '#2b3139', type: 'dashed' } }, axisLabel: { color: '#848e9c' } },
                    { scale: true, position: 'right', gridIndex: 1, splitLine: { show: false }, axisLabel: { show: false } }
                ],
                dataZoom:[{ type: 'inside', xAxisIndex:[0, 1], start: 80, end: 100 }, { type: 'slider', xAxisIndex: [0, 1], bottom: '5px', height: 25, borderColor: '#2b3139' }],
                series:[
                    {
                        name: 'K线', type: 'candlestick', data: rawData.map(i=>[i.o, i.c, i.l, i.h]),
                        itemStyle: { color: '#02c076', color0: '#f84960', borderColor: '#02c076', borderColor0: '#f84960' },
                        markPoint: { data: marks, tooltip: { formatter: p => p.data.info } }
                    },
                    { name: 'EMA12', type: 'line', data: rawData.map(i=>i.ema12), showSymbol: false, lineStyle: { width: 1.5, color: '#f0b90b' }, itemStyle: {color: '#f0b90b'} },
                    { name: 'EMA50', type: 'line', data: rawData.map(i=>i.ema50), showSymbol: false, lineStyle: { width: 1.5, color: '#9262ff' }, itemStyle: {color: '#9262ff'} },
                    { name: 'BOLL上', type: 'line', data: rawData.map(i=>i.boll_up), showSymbol: false, lineStyle: { width: 1, color: '#848e9c', type: 'dashed' }, itemStyle: {color: '#848e9c'} },
                    { name: 'BOLL下', type: 'line', data: rawData.map(i=>i.boll_dn), showSymbol: false, lineStyle: { width: 1, color: '#848e9c', type: 'dashed' }, itemStyle: {color: '#848e9c'} },
                    {
                        name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
                        data: rawData.map(i=>[i.time_str, i.v, i.o>i.c?-1:1]),
                        itemStyle: { color: p => p.data[2]>0 ? '#02c076' : '#f84960' }
                    }
                ]
            };
            myChart.setOption(option);
        }

        // 绑定 UI 交互事件
        const inputs =['in_bw', 'in_vol', 'in_slope', 'flat_window', 'flat_threshold', 'tp_pct', 'sl_pct'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                document.getElementById(`val-${id.replace('in_','').replace('_pct','').replace('_window','-win').replace('_threshold','-thr')}`).innerText = e.target.value;
                calculateAndRender(); // 拖动时实时计算
            });
        });
        
        document.getElementById('flat_enabled').addEventListener('change', (e) => {
            document.getElementById('val-flat-en').innerText = e.target.checked ? '开启' : '关闭';
            calculateAndRender();
        });

        window.addEventListener('resize', () => myChart.resize());

        // 初次加载渲染
        calculateAndRender();
    </script>
</body>
</html>
