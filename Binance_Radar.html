:00", "o": 0.0605, "c": 0.0607, "l": 0.0601, "h": 0.0607, "v": 3794110.5, "ema12": 0.06020608568738673, "ema50": 0.06014600204001055, "dif": 0.00020848169491694685, "dea": -2.623513050450638e-05, "macd": 0.0004694336508429065, "v_ma5": 13342010.6, "v_ma10": 11122189.36}]}];
            let chartInstance = null;
            let currentFilteredData =[];

            function formatMoney(num) {
                if(num >= 100000000) return (num / 100000000).toFixed(2) + " 亿";
                if(num >= 10000) return (num / 10000).toFixed(2) + " 万";
                return num.toFixed(2);
            }

            function initUI() {
                document.getElementById('interval-select').addEventListener('change', updateSymbolsList);
                document.getElementById('vol-filter').addEventListener('input', updateSymbolsList);
                document.getElementById('symbol-select').addEventListener('change', renderSelectedChart);

                chartInstance = echarts.init(document.getElementById('chart-container'));
                window.addEventListener('resize', () => chartInstance.resize());
                updateSymbolsList();
            }

            function updateSymbolsList() {
                const interval = document.getElementById('interval-select').value;
                let minVol = parseFloat(document.getElementById('vol-filter').value) || 0;

                currentFilteredData = ALL_DATA.filter(d => d.interval === interval && d.vol_raw >= minVol);
                currentFilteredData.sort((a, b) => b.vol_raw - a.vol_raw);

                const symSelect = document.getElementById('symbol-select');
                symSelect.innerHTML = '';

                if(currentFilteredData.length === 0) {
                    symSelect.innerHTML = '<option value="">无符合条件</option>';
                    document.getElementById('desc-badge').innerText = "无数据";
                    document.getElementById('vol-badge').innerText = "-";
                    chartInstance.clear();
                    return;
                }

                currentFilteredData.forEach((item, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.innerText = item.symbol.replace('USDT', '');
                    symSelect.appendChild(opt);
                });
                renderSelectedChart();
            }

            function renderSelectedChart() {
                const index = document.getElementById('symbol-select').value;
                if(!index || currentFilteredData.length === 0) return;

                const data = currentFilteredData[index];
                document.getElementById('desc-badge').innerText = data.type_icon.split(' ')[0] + " " + data.desc;
                document.getElementById('vol-badge').innerText = "额: " + formatMoney(data.vol_raw);
                drawECharts(data);
            }

            function drawECharts(dataInfo) {
                const klines = dataInfo.klines;
                const dates = klines.map(k => k.time_str);
                const values = klines.map(k =>[k.o, k.c, k.l, k.h]);
                const vols = klines.map((k, i) =>[i, k.v, k.c > k.o ? 1 : -1]);
                const ema12 = klines.map(k => k.ema12);
                const ema50 = klines.map(k => k.ema50);
                const dif = klines.map(k => k.dif);
                const dea = klines.map(k => k.dea);
                const macd = klines.map((k, i) =>[i, k.macd, k.macd > 0 ? 1 : -1]);

                const option = {
                    animation: false,
                    backgroundColor: '#161a1e',
                    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' }, backgroundColor: 'rgba(30, 35, 41, 0.9)', borderColor: '#474d57', textStyle: { color: '#EAECEF', fontSize: 12 } },
                    axisPointer: { link:[{ xAxisIndex: 'all' }] },
                    grid:[
                        { left: '2%', right: '15%', top: '5%', height: '50%' },
                        { left: '2%', right: '15%', top: '60%', height: '15%' },
                        { left: '2%', right: '15%', top: '80%', height: '15%' }
                    ],
                    xAxis:[
                        { type: 'category', data: dates, boundaryGap: false, axisLine: { lineStyle: { color: '#2b3139' } }, axisLabel: { show: false }, gridIndex: 0 },
                        { type: 'category', data: dates, boundaryGap: false, axisLine: { lineStyle: { color: '#2b3139' } }, axisLabel: { show: false }, gridIndex: 1 },
                        { type: 'category', data: dates, boundaryGap: false, axisLine: { lineStyle: { color: '#2b3139' } }, axisLabel: { color: '#848e9c', fontSize: 10 }, gridIndex: 2 }
                    ],
                    yAxis:[
                        { scale: true, splitLine: { lineStyle: { color: '#2b3139', type: 'dashed' } }, axisLabel: { color: '#848e9c', fontSize: 10 }, gridIndex: 0, position: 'right' },
                        { scale: true, splitLine: { show: false }, axisLabel: { show: false }, gridIndex: 1 },
                        { scale: true, splitLine: { show: false }, axisLabel: { show: false }, gridIndex: 2 }
                    ],
                    dataZoom:[{ type: 'inside', xAxisIndex:[0, 1, 2], start: 40, end: 100 }],
                    series:[
                        { name: 'K线', type: 'candlestick', data: values, itemStyle: { color: '#02c076', color0: '#f84960', borderColor: '#02c076', borderColor0: '#f84960' }, xAxisIndex: 0, yAxisIndex: 0 },
                        { name: 'EMA12', type: 'line', data: ema12, smooth: true, showSymbol: false, lineStyle: { width: 1.2, color: '#f0b90b' }, xAxisIndex: 0, yAxisIndex: 0 },
                        { name: 'EMA50', type: 'line', data: ema50, smooth: true, showSymbol: false, lineStyle: { width: 1.2, color: '#9262ff' }, xAxisIndex: 0, yAxisIndex: 0 },
                        { name: 'MACD', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: macd.map(item => ({ value: item[1], itemStyle: { color: item[2] > 0 ? '#02c076' : '#f84960' } })) },
                        { name: 'DIF', type: 'line', data: dif, smooth: true, showSymbol: false, lineStyle: { width: 1, color: '#f0b90b' }, xAxisIndex: 1, yAxisIndex: 1 },
                        { name: 'DEA', type: 'line', data: dea, smooth: true, showSymbol: false, lineStyle: { width: 1, color: '#9262ff' }, xAxisIndex: 1, yAxisIndex: 1 },
                        { name: '成交量', type: 'bar', xAxisIndex: 2, yAxisIndex: 2, data: vols.map(item => ({ value: item[1], itemStyle: { color: item[2] > 0 ? '#02c076' : '#f84960' } })) }
                    ]
                };
                chartInstance.setOption(option, true);
            }
            window.onload = initUI;
        </script>
