<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-100 min-h-screen p-6 md:p-12 text-slate-800">

    <div class="max-w-5xl mx-auto">
        <!-- 头部 -->
        <header class="text-center mb-16">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-4">
                个人导航工具箱
            </h1>
            <p class="text-slate-500 text-lg font-light">高效 · 纯前端 · 隐私安全</p>
        </header>

        <!-- 工具网格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- 工具 1：强趋势指标看板 -->
            <a href="Binance_Radar.html" class="tool-card glass p-6 rounded-2xl flex flex-col items-center text-center group">
                <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">📈</div>
                <h2 class="text-xl font-bold mb-2 text-slate-800">强趋势指标看板</h2>
                <p class="text-sm text-slate-500 mb-4 text-balance">实时监控币安市场强弱趋势，快速捕捉交易信号。</p>
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">进入工具 →</span>
            </a>

            <!-- 工具 2：PDF 压缩工具 -->
            <a href="pdf-compressor.html" class="tool-card glass p-6 rounded-2xl flex flex-col items-center text-center group">
                <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">📄</div>
                <h2 class="text-xl font-bold mb-2 text-slate-800">PDF 压缩工具</h2>
                <p class="text-sm text-slate-500 mb-4 text-balance">纯本地处理，不上传服务器，保护隐私的 PDF 压缩方案。</p>
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">进入工具 →</span>
            </a>

            <!-- 工具 3：占位符 (未来可添加) -->
            <div class="glass p-6 rounded-2xl flex flex-col items-center justify-center text-center border-dashed border-2 border-slate-300 opacity-60">
                <div class="text-5xl mb-4">➕</div>
                <h2 class="text-xl font-bold mb-2 text-slate-400">敬请期待</h2>
                <p class="text-sm text-slate-400">正在开发更多实用小工具...</p>
            </div>

        </div>

        <!-- 页脚 -->
        <footer class="mt-24 text-center text-slate-400 text-xs">
            <p>© 2024 我的工具箱 · 基于 GitHub Pages 托管</p>
        </footer>
    </div>

</body>
</html>
